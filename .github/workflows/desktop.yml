name: desktop

# Manual trigger on purpose. The reason used to be money — this repo was
# private and non-Linux runners billed at a multiplier — and since it went
# public (2026-08-27) standard runners are free, so what is left is time and
# noise. The Linux shell check in ci.yml already catches ordinary breakage,
# WebKitGTK is the strictest of the three engines, and release.yml builds all
# three on a tag anyway. Run this before a release, or after touching
# client/src-tauri.
on:
  workflow_dispatch:

jobs:
  shell-windows:
    name: shell builds on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: build frontend
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      # Build, not check: linking is where platform-specific breakage shows up.
      - name: build shell
        run: cargo build --manifest-path client/src-tauri/Cargo.toml

  shell-macos:
    name: shell builds on macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: build frontend
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - name: build shell
        run: cargo build --manifest-path client/src-tauri/Cargo.toml

