name: ios

# The iPhone app, signed and sent to TestFlight (T-1604, #253). Only a Mac
# builds for the iPhone, so this runs on GitHub's.
#
# Run it from the Actions tab, on `main`, naming what to build: `main` for a
# test build, or a release's tag. Signing is automatic: Xcode makes and keeps
# the certificate and profile itself, through the App Store Connect API key
# (an Admin team key, as Tauri requires for that). The key is the `release`
# environment's, which only `main` and `v*` tags can reach (#652), and its
# file is written only for this run.
#
# Each upload needs a build number App Store Connect hasn't seen for the
# version, so it's this run's number and attempt ("7.1"), never the version's
# own. The build is also kept as the `iphone-app` artifact.
# docs/releasing.md, "The iPhone", has the steps.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "What to build: main, or a release's tag such as v0.5.2"
        required: true
        default: main
      upload:
        description: "Send it to TestFlight"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  iphone:
    name: the iPhone app
    if: github.ref == 'refs/heads/main'
    environment: release
    # Named rather than macos-latest, whose image and default Xcode move on
    # by themselves: the Xcode this builds with is chosen below (#779).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: what to build
        env:
          REF: ${{ inputs.ref }}
        run: |
          [[ "$REF" == main || "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "::error::'$REF' isn't main or a release tag like v0.5.2"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - name: install frontend deps
        working-directory: client
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: client/src-tauri
      # Xcode 26, not whatever this Mac has as its default (#779). App Store
      # Connect takes uploads built with Xcode 26 or later (since 2026-04-28),
      # but an app built with Xcode 27's iOS 27 SDK won't open unless it uses
      # UIKit's scene life cycle, which Tauri 2.11 doesn't have. Move to
      # Xcode 27 with Tauri 2.12 or later, before Apple requires the iOS 27
      # SDK in April 2027, and change the check of the built app below too.
      - name: Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: what this Mac builds with
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i 'iphoneos'
      # Where both Tauri and altool look for it, by its Key ID.
      - name: the App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir"
          (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$dir/AuthKey_$APPLE_API_KEY_ID.p8")
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$dir/AuthKey_$APPLE_API_KEY_ID.p8" ||
            { echo "::error::APPLE_API_KEY_P8 isn't the .p8 file's text"; exit 1; }
          echo "APPLE_API_KEY_PATH=$dir/AuthKey_$APPLE_API_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: build the iPhone app
        working-directory: client
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          pnpm tauri ios build --ci --target aarch64 --export-method app-store-connect \
            --config "{\"bundle\":{\"iOS\":{\"bundleVersion\":\"$BUILD_NUMBER\"}}}"
      # macOS's bash is 3.2: no mapfile.
      - name: the app, as built
        run: |
          set -euo pipefail
          found="$(find client/src-tauri/gen/apple/build -name '*.ipa')"
          [ -n "$found" ] && [ "$(printf '%s\n' "$found" | wc -l)" -eq 1 ] ||
            { echo "::error::expected one .ipa, found: $found"; exit 1; }
          echo "IPA=$PWD/$found" >> "$GITHUB_ENV"
          unzip -p "$found" 'Payload/*.app/Info.plist' > "$RUNNER_TEMP/Info.plist"
          for key in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion ITSAppUsesNonExemptEncryption; do
            printf '%s: %s\n' "$key" "$(plutil -extract "$key" raw "$RUNNER_TEMP/Info.plist")"
          done
          # App Store Connect refuses an app for iOS 14 from April 2027 (#743).
          # The oldest iOS is in five places (tauri.ios.conf.json, project.yml,
          # both .xcodeproj configurations, the Podfile), and only the
          # .xcodeproj decides what's built, so this catches them drifting apart.
          want="$(node -p "require('./client/src-tauri/tauri.ios.conf.json').bundle.iOS.minimumSystemVersion")"
          got="$(plutil -extract MinimumOSVersion raw "$RUNNER_TEMP/Info.plist")"
          printf 'MinimumOSVersion: %s\n' "$got"
          [ "$got" = "$want" ] ||
            { echo "::error::the app needs iOS $got, but tauri.ios.conf.json says $want"; exit 1; }
          # Built with the iOS 26 SDK, the one Xcode 26 above brings (#779):
          # an older one isn't taken, and a newer one makes an app that
          # doesn't open while Tauri has no scene life cycle.
          sdk="$(plutil -extract DTSDKName raw "$RUNNER_TEMP/Info.plist")"
          printf 'DTSDKName: %s\nDTXcode: %s\n' "$sdk" "$(plutil -extract DTXcode raw "$RUNNER_TEMP/Info.plist")"
          case "$sdk" in
            iphoneos26.*) ;;
            *) echo "::error::built with $sdk, not the iOS 26 SDK (#779)"; exit 1 ;;
          esac
          # Share to Linger (#785): the share extension is in the app, and has
          # the app's version, which App Store Connect insists on. Its build
          # phase copies both numbers from the app's Info.plist.
          unzip -p "$found" 'Payload/*.app/PlugIns/LingerShare.appex/Info.plist' > "$RUNNER_TEMP/Share.plist" ||
            { echo "::error::the share extension isn't in the app"; exit 1; }
          for key in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion; do
            printf 'share extension %s: %s\n' "$key" "$(plutil -extract "$key" raw "$RUNNER_TEMP/Share.plist")"
          done
          for key in CFBundleShortVersionString CFBundleVersion; do
            [ "$(plutil -extract "$key" raw "$RUNNER_TEMP/Share.plist")" = "$(plutil -extract "$key" raw "$RUNNER_TEMP/Info.plist")" ] ||
              { echo "::error::the share extension's $key isn't the app's"; exit 1; }
          done
      # The privacy manifest (PrivacyInfo.xcprivacy, #779) has to be in the
      # app. Then which of the calls Apple asks a reason for the app's own
      # code makes: one in a category the manifest doesn't declare is one to
      # add there. Those are printed, not checked: Apple's scan is what counts.
      - name: the calls the privacy manifest answers for
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/payload"
          rm -rf "$dir"
          unzip -q "$IPA" 'Payload/*' -d "$dir"
          app="$(find "$dir/Payload" -maxdepth 1 -name '*.app' -type d)"
          plutil -lint "$app/PrivacyInfo.xcprivacy"
          bin="$app/$(plutil -extract CFBundleExecutable raw "$app/Info.plist")"
          [ -f "$bin" ] || { echo "::error::no app binary at $bin"; exit 1; }
          # nm on its own, so an app it can't read fails the step, and only
          # grep's "nothing matched" (status 1) reads as none of them (#781).
          imports="$(nm -u "$bin")"
          listed="$(printf '%s\n' "$imports" |
            grep -E '^_(f?stat|lstat|fstatat|f?getattrlist|getattrlistat|getattrlistbulk|f?statv?fs|mach_absolute_time)$|NSUserDefaults|NSFile(Creation|Modification)Date|NSFileSystemFree|NSURL(Creation|ContentModification|ContentAccess|AttributeModification)DateKey|NSURLVolume.*Capacity')" ||
            status=$?
          [ "${status:-0}" -le 1 ] || { echo "::error::couldn't search the app's imports"; exit 1; }
          printf '%s\n' "${listed:-none of them}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iphone-app
          path: ${{ env.IPA }}
          retention-days: 7
      - name: send it to TestFlight
        if: inputs.upload
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
