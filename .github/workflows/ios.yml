name: ios

# The iPhone app, signed and sent to TestFlight (T-1604, #253). Only a Mac
# builds for the iPhone, so this runs on GitHub's.
#
# Run it from the Actions tab, on `main`, naming what to build: `main` for a
# test build, or a release's tag. Signing is automatic: Xcode makes and keeps
# the certificate and profile itself, through the App Store Connect API key
# (an Admin team key, as Tauri requires for that). The key is the `release`
# environment's, which only `main` and `v*` tags can reach (#652), and its
# file is written only for this run.
#
# Each upload needs a build number App Store Connect hasn't seen for the
# version, so it's this run's number and attempt ("7.1"), never the version's
# own. The build is also kept as the `iphone-app` artifact.
# docs/releasing.md, "The iPhone", has the steps.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "What to build: main, or a release's tag such as v0.5.2"
        required: true
        default: main
      upload:
        description: "Send it to TestFlight"
        type: boolean
        default: true
      xcode:
        description: "Xcode to build with: 26.6 only to tell whether a problem is Xcode 27's (#839)"
        type: choice
        options:
          - "27.1"
          - "26.6"
        default: "27.1"

permissions:
  contents: read

jobs:
  iphone:
    name: the iPhone app
    if: github.ref == 'refs/heads/main'
    environment: release
    # Named rather than macos-latest, whose image and default Xcode move on
    # by themselves: the Xcode this builds with is chosen below (#779).
    # GitHub's Xcode 27 is on its own image, `xcode-27`.
    runs-on: ${{ startsWith(inputs.xcode || '27.1', '26') && 'macos-26' || 'xcode-27' }}
    timeout-minutes: 60
    env:
      XCODE: ${{ inputs.xcode || '27.1' }}
    steps:
      - name: what to build
        env:
          REF: ${{ inputs.ref }}
        run: |
          [[ "$REF" == main || "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "::error::'$REF' isn't main or a release tag like v0.5.2"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - name: install frontend deps
        working-directory: client
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: client/src-tauri
          # Build scripts' output, kept in the cache, names the Xcode they ran
          # with, and restored under another Xcode the link fails (#835): a
          # cache for each.
          key: ${{ startsWith(inputs.xcode || '27.1', '27') && 'xcode-27' || '' }}
      # The Xcode chosen above, not whatever this Mac has as its default
      # (#779). From April 2027 App Store Connect takes only builds made with
      # the iOS 27 SDK, Xcode 27's, and such an app opens only if it declares
      # UIKit's scene life cycle, as Linger has since 0.5.5 (#838, #839).
      # Xcode 26.6, on the macOS 26 image, is kept until then to tell whether
      # a problem on the testers' phones is Xcode 27's.
      - name: Xcode ${{ env.XCODE }}
        run: sudo xcode-select -s "/Applications/Xcode_$XCODE.app"
      - name: what this Mac builds with
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i 'iphoneos'
          # What sends the build to TestFlight, there before the build.
          xcrun altool --version
      # Where both Tauri and altool look for it, by its Key ID.
      - name: the App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir"
          (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$dir/AuthKey_$APPLE_API_KEY_ID.p8")
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$dir/AuthKey_$APPLE_API_KEY_ID.p8" ||
            { echo "::error::APPLE_API_KEY_P8 isn't the .p8 file's text"; exit 1; }
          echo "APPLE_API_KEY_PATH=$dir/AuthKey_$APPLE_API_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: build the iPhone app
        working-directory: client
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          pnpm tauri ios build --ci --target aarch64 --export-method app-store-connect \
            --config "{\"bundle\":{\"iOS\":{\"bundleVersion\":\"$BUILD_NUMBER\"}}}"
      # macOS's bash is 3.2: no mapfile.
      - name: the app, as built
        run: |
          set -euo pipefail
          found="$(find client/src-tauri/gen/apple/build -name '*.ipa')"
          [ -n "$found" ] && [ "$(printf '%s\n' "$found" | wc -l)" -eq 1 ] ||
            { echo "::error::expected one .ipa, found: $found"; exit 1; }
          echo "IPA=$PWD/$found" >> "$GITHUB_ENV"
          unzip -p "$found" 'Payload/*.app/Info.plist' > "$RUNNER_TEMP/Info.plist"
          for key in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion ITSAppUsesNonExemptEncryption; do
            printf '%s: %s\n' "$key" "$(plutil -extract "$key" raw "$RUNNER_TEMP/Info.plist")"
          done
          # App Store Connect refuses an app for iOS 14 from April 2027 (#743).
          # The oldest iOS is in five places (tauri.ios.conf.json, project.yml,
          # both .xcodeproj configurations, the Podfile), and only the
          # .xcodeproj decides what's built, so this catches them drifting apart.
          want="$(node -p "require('./client/src-tauri/tauri.ios.conf.json').bundle.iOS.minimumSystemVersion")"
          got="$(plutil -extract MinimumOSVersion raw "$RUNNER_TEMP/Info.plist")"
          printf 'MinimumOSVersion: %s\n' "$got"
          [ "$got" = "$want" ] ||
            { echo "::error::the app needs iOS $got, but tauri.ios.conf.json says $want"; exit 1; }
          # Built with the iOS SDK of the Xcode chosen above (#779, #839):
          # iphoneos27 for Xcode 27, the only one taken from April 2027.
          sdk="$(plutil -extract DTSDKName raw "$RUNNER_TEMP/Info.plist")"
          printf 'DTSDKName: %s\nDTXcode: %s\n' "$sdk" "$(plutil -extract DTXcode raw "$RUNNER_TEMP/Info.plist")"
          want="iphoneos${XCODE%%.*}"
          case "$sdk" in
            "$want".*) ;;
            *) echo "::error::built with $sdk, not Xcode $XCODE's iOS SDK ($want)"; exit 1 ;;
          esac
          # Share to Linger (#785) and phone notifications (#889): each
          # extension is in the app, and has the app's version, which App
          # Store Connect insists on. Their build phases copy both numbers
          # from the app's Info.plist.
          for extension in LingerShare LingerNotifications; do
            unzip -p "$found" "Payload/*.app/PlugIns/$extension.appex/Info.plist" > "$RUNNER_TEMP/$extension.plist" ||
              { echo "::error::$extension isn't in the app"; exit 1; }
            for key in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion; do
              printf '%s %s: %s\n' "$extension" "$key" "$(plutil -extract "$key" raw "$RUNNER_TEMP/$extension.plist")"
            done
            for key in CFBundleShortVersionString CFBundleVersion; do
              [ "$(plutil -extract "$key" raw "$RUNNER_TEMP/$extension.plist")" = "$(plutil -extract "$key" raw "$RUNNER_TEMP/Info.plist")" ] ||
                { echo "::error::$extension's $key isn't the app's"; exit 1; }
            done
          done
      # The privacy manifest (PrivacyInfo.xcprivacy, #779) has to be in the
      # app. Then which of the calls Apple asks a reason for the app's own
      # code makes: one in a category the manifest doesn't declare is one to
      # add there. Those are printed, not checked: Apple's scan is what counts.
      # The share extension (#785) and the notification extension (#889) are
      # programs of their own, so their calls are printed too: one making
      # any of them needs a manifest of its own.
      - name: the calls the privacy manifest answers for
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/payload"
          rm -rf "$dir"
          unzip -q "$IPA" 'Payload/*' -d "$dir"
          app="$(find "$dir/Payload" -maxdepth 1 -name '*.app' -type d)"
          plutil -lint "$app/PrivacyInfo.xcprivacy"
          for bundle in "$app" "$app/PlugIns/LingerShare.appex" "$app/PlugIns/LingerNotifications.appex"; do
            bin="$bundle/$(plutil -extract CFBundleExecutable raw "$bundle/Info.plist")"
            [ -f "$bin" ] || { echo "::error::no binary at $bin"; exit 1; }
            # nm on its own, so an app it can't read fails the step, and only
            # grep's "nothing matched" (status 1) reads as none of them (#781).
            imports="$(nm -u "$bin")"
            status=0
            listed="$(printf '%s\n' "$imports" |
              grep -E '^_(f?stat|lstat|fstatat|f?getattrlist|getattrlistat|getattrlistbulk|f?statv?fs|mach_absolute_time)$|NSUserDefaults|NSFile(Creation|Modification)Date|NSFileSystemFree|NSURL(Creation|ContentModification|ContentAccess|AttributeModification)DateKey|NSURLVolume.*Capacity')" ||
              status=$?
            [ "$status" -le 1 ] || { echo "::error::couldn't search ${bundle##*/}'s imports"; exit 1; }
            printf '%s: %s\n' "${bundle##*/}" "${listed:-none of them}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iphone-app
          path: ${{ env.IPA }}
          retention-days: 7
      # What each part is allowed to do, as signed (#811). The share extension
      # was in the app with the app's version, but signed without its App
      # Group, so it couldn't open the folder a share goes in and every share
      # failed on a phone. The notification extension needs it to read the
      # keys a notification opens with (#889). And the app is signed for
      # Apple's own push service, `production`, never its sandbox, whose
      # addresses the relay's sends to Apple's own would be refused (#889).
      # After the artifact, so a build this stops can be looked at, and
      # before TestFlight.
      - name: the App Group in every signature, and Apple's push service in the app's
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/signed"
          rm -rf "$dir"
          unzip -q "$IPA" 'Payload/*' -d "$dir"
          app="$(find "$dir/Payload" -maxdepth 1 -name '*.app' -type d)"
          # The reading is scripts/ios-app-group.mjs, tested on a real build's
          # output: a line of shell here split the key on its dots (#812).
          codesign -d --entitlements - --xml "$app" > "$RUNNER_TEMP/entitlements.plist"
          node scripts/ios-app-group.mjs "$RUNNER_TEMP/entitlements.plist" \
            group.io.github.itsmattguenther.linger "${app##*/}" production
          for bundle in "$app/PlugIns/LingerShare.appex" "$app/PlugIns/LingerNotifications.appex"; do
            codesign -d --entitlements - --xml "$bundle" > "$RUNNER_TEMP/entitlements.plist"
            node scripts/ios-app-group.mjs "$RUNNER_TEMP/entitlements.plist" \
              group.io.github.itsmattguenther.linger "${bundle##*/}"
          done
      - name: send it to TestFlight
        if: inputs.upload
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
