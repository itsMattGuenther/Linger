name: ios-try

# One-off, never merged: builds the iPhone app on a Mac, unsigned, from this
# branch, so ios.yml's first real run on main isn't its first build, and shows
# what the build changes in the committed Xcode project. No secrets.
on:
  push:
    branches: [feat/253-iphone]
    paths:
      - .github/workflows/ios-try.yml
      - client/src-tauri/gen/apple/**
      - client/src-tauri/Info.ios.plist
      - client/src-tauri/tauri.ios.conf.json

permissions:
  contents: read

jobs:
  try:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - name: install frontend deps
        working-directory: client
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: client/src-tauri
      - name: build, unsigned
        working-directory: client
        run: |
          pnpm tauri ios build --ci --target aarch64 --no-sign \
            --config '{"bundle":{"iOS":{"bundleVersion":"1.1"}}}'
      - name: what it made
        run: |
          set -euo pipefail
          git status --short
          git diff -- client/src-tauri/gen/apple/linger-client_iOS client/src-tauri/gen/apple/linger-client.xcodeproj
          found="$(find client/src-tauri/gen/apple/build -name '*.ipa')"
          echo "$found"
          ls -l $found
          unzip -p "$found" 'Payload/*.app/Info.plist' > "$RUNNER_TEMP/Info.plist"
          plutil -p "$RUNNER_TEMP/Info.plist"
