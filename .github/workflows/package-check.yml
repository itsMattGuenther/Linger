name: package check

# Unsigned test artifacts only: no release, signing secret or updater publication.
on:
  pull_request:
  workflow_dispatch:
  # nightly.yml runs every check here on main.
  workflow_call:
    inputs:
      all:
        description: Build and check the packages whatever changed
        type: boolean
        default: false

concurrency:
  group: package-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.classify.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_SCOPE_ALL: ${{ inputs.all }}
        run: node scripts/ci-scope.mjs
  packages:
    needs: changes
    if: ${{ needs.changes.outputs.packages == 'true' }}
    env:
      # These are inspectable test packages, not symbol archives. Full Rust
      # debug info makes the WebRTC/WebKit link and AppImage needlessly huge.
      CARGO_PROFILE_DEV_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      # For scripts/linux-audio-check.py; every other check here is Node or shell.
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
          cache-on-failure: true
      - name: Linux build tools
        if: runner.os == 'Linux'
        # gstreamer1.0-libav's plugin goes into the AppImage with the rest of
        # this machine's GStreamer plugins, for shared videos' sound; its
        # FFmpeg is scripts/appimage-ffmpeg.sh's, below (#358).
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev build-essential curl wget file libxdo-dev patchelf libarchive-tools nasm \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio gstreamer1.0-libav \
            libunwind-dev libgstreamer1.0-dev xvfb xauth dbus-x11 pulseaudio pulseaudio-utils rpm
      - name: FFmpeg for the AppImage
        # Only the decoders a shared video needs, about 4 MB, rather than the
        # 45 MB Ubuntu's own FFmpeg would bring (#358).
        if: runner.os == 'Linux'
        run: scripts/appimage-ffmpeg.sh "$RUNNER_TEMP/ffmpeg"
      - run: pnpm install --frozen-lockfile
        working-directory: client
      - name: Approved artwork is current
        run: node scripts/app-icons.mjs --check
      - name: Build unsigned packages without updater artifacts
        working-directory: client
        # Debug profile saves CI time; tauri build still packages the built frontend.
        # No test package is published to the release channel.
        shell: bash
        run: |
          # The AppImage bundler takes FFmpeg from here, not the system (#358).
          # Ahead of what's there: setup-python puts its own library directory on it.
          if [ "$RUNNER_OS" = Linux ]; then export LD_LIBRARY_PATH="$RUNNER_TEMP/ffmpeg/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"; fi
          pnpm tauri build --debug --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Linux package contents
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package-check/deb package-check/rpm package-check/appimage
          dpkg-deb -x client/src-tauri/target/debug/bundle/deb/*.deb package-check/deb
          bsdtar -xf client/src-tauri/target/debug/bundle/rpm/*.rpm -C package-check/rpm
          node scripts/package-icons.mjs --linux-root package-check/deb
          node scripts/package-icons.mjs --linux-root package-check/rpm
          package=$(realpath client/src-tauri/target/debug/bundle/appimage/*.AppImage)
          (cd package-check/appimage && "$package" --appimage-extract >/dev/null)
          node scripts/package-icons.mjs --linux-root package-check/appimage/squashfs-root
      - name: Packaged Linux audio and dependency metadata
        if: runner.os == 'Linux'
        shell: bash
        run: |
          scripts/package-audio-deps.sh client/src-tauri/target/debug/bundle
          python scripts/linux-audio-check.py client/src-tauri/target/debug/bundle/appimage/*.AppImage --appimage --output package-check/audio-appimage
          python scripts/linux-audio-check.py client/src-tauri/target/debug/bundle/appimage/*.AppImage --appimage --video --output package-check/video-appimage
          scripts/appimage-ffmpeg-check.sh client/src-tauri/target/debug/bundle/appimage/*.AppImage
          python scripts/linux-audio-check.py package-check/deb/usr/bin/linger-client --output package-check/audio-deb
          python scripts/linux-audio-check.py package-check/rpm/usr/bin/linger-client --output package-check/audio-rpm
      - name: The Buddy list starts in the packaged Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node scripts/linux-next-check.mjs client/src-tauri/target/debug/bundle/appimage/*.AppImage --appimage --output package-check/next-appimage
          node scripts/linux-next-check.mjs package-check/deb/usr/bin/linger-client --output package-check/next-deb
      - name: Windows upgrades preserve desktop shortcuts
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/windows-update-check.ps1 -Bundle client/src-tauri/target/debug/bundle -Output package-check/updates
      - name: Installed Windows packages, audio and running icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/windows-icon-check.ps1 -Bundle client/src-tauri/target/debug/bundle -Output package-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-check-${{ runner.os }}
          path: |
            client/src-tauri/target/debug/bundle/appimage/*.AppImage
            client/src-tauri/target/debug/bundle/deb/*.deb
            client/src-tauri/target/debug/bundle/rpm/*.rpm
            client/src-tauri/target/debug/bundle/nsis/*-setup.exe
            client/src-tauri/target/debug/bundle/msi/*.msi
            package-check/running-window-icon.png
            package-check/next/buddy-list-signin.png
            package-check/next/next_open_settings.png
            package-check/next/next_open_conversation.png
            package-check/next/result.json
            package-check/next-*/result.json
            package-check/audio-*/*.log
            package-check/audio-*/*.json
            package-check/audio-*/*.f32
            package-check/updates/*.log
          retention-days: 7
