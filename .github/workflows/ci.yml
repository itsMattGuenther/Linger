name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml and image.yml run all of it on the commit they ship, and
  # nightly.yml on main every night (docs/testing-strategy.md).
  workflow_call:
    inputs:
      all:
        description: Run every job, whatever changed
        type: boolean
        default: false

concurrency:
  # A called run belongs to its caller: `github.workflow` is the caller's name
  # there, so release and image runs of one tag don't queue behind each other.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # AGENTS.md: deny(warnings) in CI. Local builds stay permissive on purpose.
  RUSTFLAGS: -D warnings

jobs:
  changes:
    # Keep a real check for docs-only PRs, but do not start four unrelated
    # build/test jobs. Job-level skips report success even when checks become
    # required; skipping the entire workflow can leave them pending.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      s3: ${{ steps.classify.outputs.s3 }}
      web: ${{ steps.classify.outputs.web }}
      shell: ${{ steps.classify.outputs.shell }}
      coturn: ${{ steps.classify.outputs.coturn }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_SCOPE_ALL: ${{ inputs.all }}
        run: node scripts/ci-scope.mjs

  # What hosts run from deploy/: the relay, and the update and setup scripts (#312, #440).
  coturn:
    name: deploy
    needs: changes
    if: ${{ needs.changes.outputs.coturn == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shipped relay starts and refuses an empty secret
        run: bash scripts/coturn-test.sh
      - name: update and setup scripts pass shellcheck
        run: shellcheck deploy/update.sh deploy/setup.sh deploy/entrypoint.sh scripts/update-test.sh scripts/update-docker-test.sh scripts/setup-test.sh scripts/coturn-test.sh scripts/image-start-test.sh
      - name: update script, against a stand-in docker
        run: bash scripts/update-test.sh
      - name: setup script, against stand-ins (#440)
        run: bash scripts/setup-test.sh
      - name: update script, updating a real 0.4.2 server to 0.4.3
        run: bash scripts/update-docker-test.sh

  rust:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: ffmpeg
        # Video posters and durations shell out to ffmpeg, and the tests for
        # them skip themselves when it is missing rather than failing (a server
        # without ffmpeg is a supported thing — ARCHITECTURE §8). A skipped test
        # is a test nobody is running, so the runner gets ffmpeg. The published
        # image has had it since T-501.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: generated bindings are current
        # cargo test just regenerated client/src/generated; a diff means someone
        # changed a wire type without committing the regenerated bindings.
        run: git diff --exit-code client/src/generated

  s3:
    needs: changes
    if: ${{ needs.changes.outputs.s3 == 'true' }}
    # The S3 storage backend, against a real S3 API. These tests skip themselves
    # when LINGER_TEST_S3_ENDPOINT is unset, which is what keeps the `rust` job
    # and every laptop green without a bucket — so they need a job that sets it,
    # or they would never actually run anywhere.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LINGER_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      LINGER_TEST_S3_BUCKET: linger-test
      LINGER_TEST_S3_REGION: us-east-1
      LINGER_TEST_S3_ACCESS_KEY_ID: lingertest
      LINGER_TEST_S3_SECRET_ACCESS_KEY: lingertestsecret
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # MinIO no longer publishes images or binaries: the Docker Hub image went
      # first (#64), then the quay.io image and the dl.min.io downloads. The
      # source is still public, so build the pinned release from it. The tag is
      # pinned — an object store that changes under the tests is a flaky suite
      # nobody can debug — and the binary is cached, so this builds once per tag.
      - name: minio binary cache
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: ~/minio-bin
          key: minio-RELEASE.2025-09-07T16-13-09Z-${{ runner.os }}
      - uses: actions/setup-go@v5
        if: steps.minio-cache.outputs.cache-hit != 'true'
        with:
          go-version: "1.24"
          cache: false
      - name: build minio
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: GOBIN="$HOME/minio-bin" go install github.com/minio/minio@RELEASE.2025-09-07T16-13-09Z
      - name: minio
        # Started in the background; it lives until the job ends.
        run: |
          mkdir -p "$RUNNER_TEMP/minio-data"
          MINIO_ROOT_USER=$LINGER_TEST_S3_ACCESS_KEY_ID \
          MINIO_ROOT_PASSWORD=$LINGER_TEST_S3_SECRET_ACCESS_KEY \
            nohup "$HOME/minio-bin/minio" server "$RUNNER_TEMP/minio-data" \
            --address 127.0.0.1:9000 >"$RUNNER_TEMP/minio.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null "$LINGER_TEST_S3_ENDPOINT/minio/health/live" && exit 0
            sleep 1
          done
          echo "minio never came up" >&2
          cat "$RUNNER_TEMP/minio.log" >&2
          exit 1
      - name: s3 backend tests
        # The bucket is created by the test harness on first use.
        run: cargo test -p linger-server --test s3 -- --nocapture

  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    # Each job's limit is about three times a normal run. Without one, a hung
    # job holds its check pending for GitHub's default of six hours.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: enable pnpm
        run: corepack enable
      - name: install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm check
      - name: test
        run: pnpm test
      - name: build
        run: pnpm exec vite build
      - name: the build embeds nothing the shipped CSP refuses
        # Dev mode serves every asset as a file, so only a production build
        # shows an embedded font or sound the CSP blocks (#318).
        run: node ../scripts/csp-assets.mjs dist

  # The browser checks, in both engines: Chromium is WebView2 (Windows) and
  # WebKit is under WebKitGTK (Linux). Each engine runs in parts at once
  # (`--shard`), so no part takes much over four minutes: in one job each,
  # Chromium took about 6 minutes and WebKit, 1.6 times slower on nearly
  # every test, about 12 (2026-09-28). Only `all green` is a required check,
  # so these names can change freely.
  web-browser:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    name: web-${{ matrix.engine }} (${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: chromium, shard: 1, shards: 2 }
          - { engine: chromium, shard: 2, shards: 2 }
          - { engine: webkit, shard: 1, shards: 3 }
          - { engine: webkit, shard: 2, shards: 3 }
          - { engine: webkit, shard: 3, shards: 3 }
    runs-on: ubuntu-latest
    # In Playwright's own image, which has both browsers and every library
    # they need. Installing those libraries from Ubuntu's mirror
    # (`playwright install --with-deps`) could take the whole 20 minutes on a
    # slow day and cancel the job with no test run: a WebKit part on #356 and
    # the nightly run, 2026-09-30. User 1001 is the runner's own, so the files
    # the job writes are the runner's. `scripts/version-check.sh` holds the
    # tag to the client's @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
        # In a container, GitHub runs steps with sh unless told otherwise,
        # and these steps use bash: (( )) arithmetic and mapfile.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: enable pnpm
        run: corepack enable
      - name: install
        run: pnpm install --frozen-lockfile
      - name: browser layout and keyboard checks (${{ matrix.engine }}, part ${{ matrix.shard }} of ${{ matrix.shards }})
        run: pnpm test:browser --project=${{ matrix.engine }} --shard=${{ matrix.shard }}/${{ matrix.shards }}
      - name: browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.engine }}-${{ matrix.shard }}
          path: client/test-results
          retention-days: 7

  new-tests:
    # L-31: a browser test a PR adds or edits runs ten times over in both
    # engines, with no retries, before it lands. A test that fails one run in
    # ten fails here, on the PR that wrote it, not at random on somebody
    # else's. `scripts/changed-tests.mjs` finds the tests from the lines the
    # PR changed. The budget is about 300 runs per engine: fewer repeats
    # (never under two) when a PR touches many tests, and none past 300
    # tests, which the nightly run repeats anyway.
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' && github.event_name == 'pull_request' }}
    name: new tests, repeated (${{ matrix.engine }})
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-latest
    # Playwright's image, as web-browser above.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
        # In a container, GitHub runs steps with sh unless told otherwise,
        # and these steps use bash: (( )) arithmetic and mapfile.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: enable pnpm
        run: corepack enable
      - name: install
        run: pnpm install --frozen-lockfile
      - name: which tests this PR added or edited
        id: pick
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node ../scripts/changed-tests.mjs "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/tests.txt"
          n=$(wc -l < "$RUNNER_TEMP/tests.txt")
          repeat=$(( n ? 300 / n : 0 )); (( repeat > 10 )) && repeat=10; (( n && repeat < 2 )) && repeat=2
          (( n > 300 )) && repeat=0
          echo "$n test(s) added or edited; repeating each $repeat times"
          cat "$RUNNER_TEMP/tests.txt"
          echo "repeat=$repeat" >> "$GITHUB_OUTPUT"
      - name: the new and edited tests, repeated, with no retries
        if: steps.pick.outputs.repeat != '0'
        run: |
          mapfile -t tests < "$RUNNER_TEMP/tests.txt"
          pnpm test:browser --project=${{ matrix.engine }} --retries=0 \
            --repeat-each=${{ steps.pick.outputs.repeat }} "${tests[@]}"
      - name: browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: new-test-failures-${{ matrix.engine }}
          path: client/test-results
          retention-days: 7

  tauri-shell:
    needs: changes
    if: ${{ needs.changes.outputs.shell == 'true' }}
    # Builds the desktop shell against real WebKitGTK and runs its tests — the
    # gateway client lives here, and its resume/sequence accounting is the kind
    # of thing that has to be gated, not checked by hand. Signed bundles for all
    # three OSes are release.yml, which only a tag fires.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: system webview deps
        run: |
          sudo apt-get update
          # libasound2-dev is the microphone (cpal talks ALSA on Linux,
          # T-1402). Opus is built from vendored source with the runner's
          # cmake, so no libopus package is needed here or anywhere.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - name: clippy (shell)
        # The root clippy job can't reach this crate: it is deliberately outside
        # the workspace, so it needs its own pass.
        run: |
          mkdir -p client/dist
          cargo clippy --manifest-path client/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: cargo test (shell)
        # The ignored tests need a real desktop session (an unlocked keyring),
        # which a runner does not have. Everything else runs here.
        run: |
          mkdir -p client/dist
          cargo test --manifest-path client/src-tauri/Cargo.toml

  rules:
    # The AGENTS.md hard rules a grep can catch: no AI attribution in commits,
    # identities, or the tree, and the dropped vocabulary stays dropped (SPEC §1).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: rules lint
        run: scripts/lint-rules.sh "${{ github.event.pull_request.base.sha || '' }}"
      - name: one version number in four files
        # An updater that compares the wrong version is a release that installs
        # nothing and reports success (T-701).
        run: scripts/version-check.sh
      - name: test CI selection, and that every job is in the gate
        run: node --test scripts/ci-scope.test.mjs scripts/ci-gate.test.mjs scripts/changed-tests.test.mjs
      - name: test the build's CSP check
        run: node --test scripts/csp-assets.test.mjs
      - name: the release's Android check reads every apksigner's signer line
        # 0.4.8 and 0.4.9 refused rightly signed APKs over one line's wording.
        run: bash scripts/android-signing-test.sh
      - name: tidying branches deletes only what's in main
        # A squash merge leaves no trace in a branch's own commits, so the
        # script asks GitHub; a wrong answer would delete unmerged work.
        run: bash scripts/tidy-branches-test.sh
      - name: the Linux packages ask for the media plugins shared videos need
        # Without the AAC and H.264 decoders a shared video plays silent, or
        # not at all (#358).
        run: node --test scripts/package-deps.test.mjs
      - name: the Linux audio check tells sound lost on the way to the speaker from a click
        # A runner its host pauses loses part of a chime before the virtual
        # speaker records it. Only that plays the set again (#384).
        run: python3 scripts/linux-audio-check.test.py -q
      - name: the browser jobs' Playwright image is the client's Playwright
        run: node --test scripts/playwright-image.test.mjs
      - name: workflow files
        # A broken workflow doesn't fail; it just doesn't run, and the
        # required check waits forever. actionlint also shellchecks each step.
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color

  all-green:
    # The one required check (the "Protect main" ruleset). It passes when
    # every job passed or was skipped because the change didn't touch it, and
    # fails on any other result: failed, cancelled, or `abandoned`, which is
    # what a job GitHub never found a machine for reports (#445). A new job
    # joins by being listed here; scripts/ci-gate.test.mjs fails if one isn't.
    # Renaming or adding jobs never needs a settings change.
    name: all green
    if: always()
    needs: [changes, coturn, rust, s3, web, web-browser, new-tests, tauri-shell, rules]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job passed, or had nothing to check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          if jq -e 'any(.[]; .result != "success" and .result != "skipped")' <<<"$RESULTS" >/dev/null; then
            echo "::error title=all green::a job above failed, was cancelled, or never ran"
            exit 1
          fi
