name: image

# The server as a container image, on ghcr.io (T-703). `deploy/compose.yaml`
# pulls `ghcr.io/itsmattguenther/linger:latest`, so this is what a host
# actually runs — the desktop installers in release.yml are the other half of
# a release, and this is this half.
#
# Same shape as release.yml, for the same reason: **only a tag publishes.**
#
#   tag v0.2.0            build and push 0.2.0, 0.2, latest
#   Actions tab (manual)  build, push nothing — proves the image still builds
#                         without shipping anything
#   pull request          build, push nothing, and only when a file the image
#                         is made of changed
#
# x86-64 (linux/amd64) only. ARM64 went after 0.4.4: built under emulation it
# took over an hour of every release, for hosts nobody has (docs/decisions.md).
#
# **One human step, once ever:** the first push creates the package as
# *private*, and a private package means `docker compose up` fails with
# "unauthorized" for everybody who is not Matt. Open
# github.com/users/itsMattGuenther/packages/container/linger/settings and set
# it public. There is no flag here that can do it.

on:
  push:
    tags: ["v*"]
  pull_request:
    # Not on every pull request: the image is a full release build of the
    # server and it is slow. These are the files it is actually made of.
    paths:
      - deploy/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/image.yml
  workflow_dispatch:

# Image names cannot contain capital letters. github.repository is
# itsMattGuenther/Linger; we lowercase it so the package name is legal and
# always lives under the current GitHub owner. That name also has to be the
# one in deploy/compose.yaml, or a host following the compose file pulls
# something this job never pushed.

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    # About five minutes from the cache; a cold build is longer.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: image name
        # Fail here, not after the compile, if compose.yaml still
        # points at a GitHub user that no longer exists.
        run: |
          expected="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          got=$(grep -o 'ghcr.io/[^:[:space:]]*' deploy/compose.yaml | head -1)
          if [ "$got" != "$expected" ]; then
            echo "deploy/compose.yaml has $got but this repo's image is $expected"
            exit 1
          fi
          echo "IMAGE=$expected" >> "$GITHUB_ENV"
          echo "publishing $expected"

      - uses: docker/setup-buildx-action@v3

      - name: sign in to ghcr
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v0.2.0 publishes 0.2.0 and 0.2, and moves `latest`. `latest` is
          # what compose.yaml asks for, so moving it is what makes
          # `docker compose pull` find a new server.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=${{ github.ref_type == 'tag' }}

      - name: build${{ github.ref_type == 'tag' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          # If ARM64 ever comes back, build it on a native `ubuntu-24.04-arm`
          # runner and push by digest, not under emulation here.
          platforms: linux/amd64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A cache that survives between runs, so a tag build is not a cold
          # `cargo build --release` from scratch every time.
          cache-from: type=gha
          cache-to: type=gha,mode=max
