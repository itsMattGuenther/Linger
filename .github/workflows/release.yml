name: release

# Tag-driven, and only tag-driven (T-701). Not a cost rule — the repo is public,
# so standard runners are free — but a correctness one: this job cuts a release
# and uses the signing key, and neither belongs on a push or a pull request.
# To ship:
#
#   1. bump the version in client/package.json, client/src-tauri/Cargo.toml,
#      client/src-tauri/tauri.conf.json and the root Cargo.toml — all four,
#      `scripts/version-check.sh` says so if you miss one
#   2. commit, then `git tag v0.2.0 && git push origin v0.2.0`
#   3. this runs every CI check on the tagged commit, then builds Linux and
#      Windows bundles and opens a **draft** release with `latest.json`
#   4. read it, then publish it — publishing is what ships the update, and it is
#      a human's click on purpose
#
# The updater endpoint in tauri.conf.json points at this repo's
# releases/latest/download/latest.json, so a draft is invisible to every
# installed copy until you publish it.
#
# Running it from the Actions tab (workflow_dispatch) does the checks and stops:
# it proves the signing secrets are right, and the tests pass, without cutting a
# release. Only a tag builds anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    # Every CI check, on exactly the commit this tag ships, and nothing is
    # built unless it passes. A release used to build whatever was tagged:
    # 0.4.3 shipped from a commit whose WebKit check had failed (a real bug,
    # #266), and a `main` run can be cancelled by a newer merge, leaving a
    # commit that was never tested at all.
    uses: ./.github/workflows/ci.yml
    with:
      all: true

  preflight:
    name: the tag and the key agree with the tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: versions match the tag
        # On a manual run there is no tag to match, only the four files.
        run: scripts/version-check.sh "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: install frontend deps
        working-directory: client
        # Only for the Tauri CLI, which is what does the signing.
        run: pnpm install --frozen-lockfile
      - name: the signing key works and is the one the app trusts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Signs a throwaway file for real, then checks the key id against
        # tauri.conf.json. "Present" is not "correct": a key that signs fine but
        # isn't the mate of the committed public key builds a green release that
        # no installed copy will accept.
        run: scripts/signing-preflight.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: the Android key opens and is the one every release is signed with
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        # The same reasoning for the phone (T-1604): signed with any other key,
        # an APK won't install over the Linger a phone already has.
        run: scripts/android-signing.sh check

  bundle:
    name: ${{ matrix.label }}
    needs: [preflight, tests]
    # A manual run is a check, not a release. Only a tag builds and publishes.
    if: github.ref_type == 'tag'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One platform failing should not throw away the other's finished build.
      # The release is a draft either way, so a partial one is reviewable.
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: a bundle built against a newer glibc will
          # not start on an older distribution, and the reverse is fine.
          - label: Linux
            os: ubuntu-22.04
            rust-target: ""
            args: ""
          - label: Windows
            os: windows-latest
            rust-target: ""
            args: ""
          # macOS is deliberately absent (Matt, 2026-08-27 — docs/decisions.md).
          # Notarization needs an Apple Developer Program membership, and until
          # there is one, shipping an *unsigned* macOS bundle would be the worst
          # of the three options: Gatekeeper on recent macOS sends the user into
          # System Settings to click past "macOS cannot verify this app is free
          # of malware", and the later move from an ad-hoc signature to a real
          # Developer ID one is exactly the transition that breaks an app the
          # updater has replaced in place. Shipping nothing orphans nobody.
          #
          # To turn it back on, uncomment these two and do T-705 in the same
          # pass — an unsigned macOS build is not a step towards a signed one.
          #
          # - label: macOS (Apple silicon)
          #   os: macos-latest
          #   rust-target: aarch64-apple-darwin
          #   args: --target aarch64-apple-darwin
          # - label: macOS (Intel)
          #   os: macos-latest
          #   rust-target: x86_64-apple-darwin
          #   args: --target x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: system webview deps
        if: matrix.os == 'ubuntu-22.04'
        # Tauri's own documented Linux prerequisites, plus what the AppImage and
        # deb bundlers shell out to. Follow the current vendor list when this
        # breaks, not this comment (AGENTS.md, "where you will be wrong").
        # The AppImage bundles this machine's GStreamer plugins
        # (bundleMediaFramework), so gstreamer1.0-libav here is what lets it
        # play a shared video's H.264 and AAC; its FFmpeg is
        # scripts/appimage-ffmpeg.sh's, below (#358).
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev \
            build-essential curl wget file libxdo-dev patchelf nasm \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio gstreamer1.0-libav \
            libunwind-dev libgstreamer1.0-dev xvfb xauth dbus-x11 pulseaudio pulseaudio-utils rpm libarchive-tools

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: FFmpeg for the AppImage
        # Only the decoders a shared video needs, about 4 MB, rather than the
        # 45 MB Ubuntu's own FFmpeg would bring (#358).
        if: matrix.os == 'ubuntu-22.04'
        run: scripts/appimage-ffmpeg.sh "$RUNNER_TEMP/ffmpeg"

      - name: linuxdeploy for the AppImage
        # A newer one than Tauri 2.11 fetches, which doesn't put this machine's
        # libwayland into the AppImage, where it breaks newer Mesa (#479).
        if: matrix.os == 'ubuntu-22.04'
        run: scripts/appimage-linuxdeploy.sh

      - name: install frontend deps
        working-directory: client
        # tauri-action builds, it does not install. The frontend build itself is
        # tauri.conf.json's beforeBuildCommand.
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The AppImage bundler takes FFmpeg from here, not the system (#358).
          LD_LIBRARY_PATH: ${{ matrix.os == 'ubuntu-22.04' && format('{0}/ffmpeg/lib', runner.temp) || '' }}
          # Every desktop has its own libwayland; the AppImage's would break
          # newer Mesa (#479). Read by scripts/appimage-linuxdeploy.sh's linuxdeploy.
          LINUXDEPLOY_EXCLUDED_LIBRARIES: ${{ matrix.os == 'ubuntu-22.04' && 'libwayland-*' || '' }}
          # The bundler signs every updater artifact with this. tauri.conf.json
          # has createUpdaterArtifacts on, so a build with no key here fails
          # rather than quietly producing something no installed copy accepts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Linger ${{ github.ref_name }}
          releaseBody: |
            **This is the Linger app** — the thing you install on your own
            computer to join a server somebody else runs.

            **It is not the server.** If you want to *host* a Linger, nothing on
            this page is for you: the server is a container image, and the
            [host guide](https://github.com/${{ github.repository }}/blob/main/docs/host-guide.md)
            walks through setting one up.

            ### Which file do I want?

            | Your computer | Download the file ending in |
            |---|---|
            | Windows | `-setup.exe` |
            | Debian, Ubuntu or Mint | `.deb` |
            | Fedora, RHEL or openSUSE | `.rpm` |
            | Any other Linux | `.AppImage` — make it executable and run it |
            | macOS | Not built yet — see [decisions.md](https://github.com/${{ github.repository }}/blob/main/docs/decisions.md) |
            | Android phone | `_android-arm64.apk` — download it on the phone |
            | iPhone | Not yet |

            The `.msi` is for companies rolling it out to many machines at once.
            If you are not sure, you want the `.exe`.

            The `.sig` files and `latest.json` are how an installed copy checks
            that an update is genuine. You do not need to download them.

            **Windows will warn you.** You get *"Windows protected your PC"*, and
            *Run anyway* is behind the small *More info* link. That is Windows
            saying the installer has not been through a paid signing process. It
            has not — that is a
            [known decision](https://github.com/${{ github.repository }}/blob/main/docs/decisions.md),
            not a broken download.

            **Android will ask before installing.** The phone says it won't
            install apps from your browser until you allow it: tap *Settings*,
            turn on *Allow from this source*, and go back. That is Android's
            rule for any app that isn't from the Play Store. The phone app
            doesn't update itself: install each new one from its release page,
            right over the old one, and you stay signed in.

            New here? The
            [user guide](https://github.com/${{ github.repository }}/blob/main/docs/user-guide.md)
            covers installing and using Linger in plain language.
          # Draft on purpose: publishing is what ships the update to everyone,
          # and that is a decision, not a side effect of pushing a tag.
          releaseDraft: true
          prerelease: false
          # `latest.json` — the manifest the updater reads. Every matrix job
          # merges its platform into the same file on the same release.
          includeUpdaterJson: true

      # Check the signed packages too, while the release is still a draft.
      # A successful compile is not proof that native media plugins shipped.
      - name: Linux package audio
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          scripts/package-audio-deps.sh client/src-tauri/target/release/bundle
          mkdir -p package-check/deb package-check/rpm
          dpkg-deb -x client/src-tauri/target/release/bundle/deb/*.deb package-check/deb
          bsdtar -xf client/src-tauri/target/release/bundle/rpm/*.rpm -C package-check/rpm
          python3 scripts/linux-audio-check.py client/src-tauri/target/release/bundle/appimage/*.AppImage --appimage --output package-check/audio-appimage
          # The AppImage carries its own GStreamer: a shared video's H.264 and
          # AAC play only if the build machine's libav decoders went in (#358).
          python3 scripts/linux-audio-check.py client/src-tauri/target/release/bundle/appimage/*.AppImage --appimage --video --output package-check/video-appimage
          scripts/appimage-ffmpeg-check.sh client/src-tauri/target/release/bundle/appimage/*.AppImage
          scripts/appimage-wayland-check.sh client/src-tauri/target/release/bundle/appimage/*.AppImage
          python3 scripts/linux-audio-check.py package-check/deb/usr/bin/linger-client --output package-check/audio-deb
          python3 scripts/linux-audio-check.py package-check/rpm/usr/bin/linger-client --output package-check/audio-rpm
      - name: The Buddy list starts in the signed Linux packages
        # The PR package check runs this on debug builds; this is the build
        # people install. Windows gets the same from windows-icon-check.ps1.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/linux-next-check.mjs client/src-tauri/target/release/bundle/appimage/*.AppImage --appimage --output package-check/next-appimage
          node scripts/linux-next-check.mjs package-check/deb/usr/bin/linger-client --output package-check/next-deb
      - name: Windows upgrades preserve desktop shortcuts
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/windows-update-check.ps1 -Bundle client/src-tauri/target/release/bundle -Output package-check/updates
      - name: Windows package audio and icons
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/windows-icon-check.ps1 -Bundle client/src-tauri/target/release/bundle -Output package-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-audio-${{ matrix.label }}
          path: |
            package-check/audio-*/*.log
            package-check/audio-*/*.json
            package-check/audio-*/*.f32
            package-check/next-*/result.json
            package-check/updates/*.log
          retention-days: 7

  # The Android phone app (SPEC §4.15, T-1604): one signed APK for 64-bit
  # phones, added to the draft the desktop bundles opened. Until there is a
  # store listing, Android friends install this file. Every release is signed
  # with the same key, or it won't install over the last one, so the key is
  # checked against the committed fingerprint before the build and the APK
  # after it (scripts/android-signing.sh).
  android:
    name: Android
    needs: [preflight, tests, bundle]
    # Only a tag builds, and only once the draft exists to add to.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: install frontend deps
        working-directory: client
        run: pnpm install --frozen-lockfile
      # Java 21: the Gradle in gen/android can't run on 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      # The runner has the Android SDK and an NDK already.
      - name: point Tauri at the NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: the release key, for Gradle
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: scripts/android-signing.sh setup
      - name: build the Android app
        working-directory: client
        run: pnpm tauri android build --target aarch64 --apk
      - name: signed with the release key, then onto the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk=client/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          scripts/android-signing.sh verify "$apk"
          version="$(node -p "require('./client/src-tauri/tauri.conf.json').version")"
          named="$RUNNER_TEMP/Linger_${version}_android-arm64.apk"
          cp "$apk" "$named"
          gh release upload "$GITHUB_REF_NAME" "$named" --clobber
