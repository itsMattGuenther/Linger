name: release

# Tag-driven, and only tag-driven (T-701). Not a cost rule — the repo is public,
# so standard runners are free — but a correctness one: this job cuts a release
# and uses the signing key, and neither belongs on a push or a pull request.
# To ship:
#
#   1. bump the version in client/package.json, client/src-tauri/Cargo.toml,
#      client/src-tauri/tauri.conf.json and the root Cargo.toml — all four,
#      `scripts/version-check.sh` says so if you miss one
#   2. commit, then `git tag v0.2.0 && git push origin v0.2.0`
#   3. this builds Linux and Windows bundles and opens a **draft** release with
#      `latest.json`
#   4. read it, then publish it — publishing is what ships the update, and it is
#      a human's click on purpose
#
# The updater endpoint in tauri.conf.json points at this repo's
# releases/latest/download/latest.json, so a draft is invisible to every
# installed copy until you publish it.
#
# Running it from the Actions tab (workflow_dispatch) does the checks and stops:
# it proves the signing secrets are right without cutting a release. Only a tag
# builds anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    name: the tag and the key agree with the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: versions match the tag
        # On a manual run there is no tag to match, only the four files.
        run: scripts/version-check.sh "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: install frontend deps
        working-directory: client
        # Only for the Tauri CLI, which is what does the signing.
        run: pnpm install --frozen-lockfile
      - name: the signing key works and is the one the app trusts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Signs a throwaway file for real, then checks the key id against
        # tauri.conf.json. "Present" is not "correct": a key that signs fine but
        # isn't the mate of the committed public key builds a green release that
        # no installed copy will accept.
        run: scripts/signing-preflight.sh

  bundle:
    name: ${{ matrix.label }}
    needs: preflight
    # A manual run is a check, not a release. Only a tag builds and publishes.
    if: github.ref_type == 'tag'
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not throw away the other's finished build.
      # The release is a draft either way, so a partial one is reviewable.
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: a bundle built against a newer glibc will
          # not start on an older distribution, and the reverse is fine.
          - label: Linux
            os: ubuntu-22.04
            rust-target: ""
            args: ""
          - label: Windows
            os: windows-latest
            rust-target: ""
            args: ""
          # macOS is deliberately absent (Matt, 2026-08-27 — docs/decisions.md).
          # Notarization needs an Apple Developer Program membership, and until
          # there is one, shipping an *unsigned* macOS bundle would be the worst
          # of the three options: Gatekeeper on recent macOS sends the user into
          # System Settings to click past "macOS cannot verify this app is free
          # of malware", and the later move from an ad-hoc signature to a real
          # Developer ID one is exactly the transition that breaks an app the
          # updater has replaced in place. Shipping nothing orphans nobody.
          #
          # To turn it back on, uncomment these two and do T-705 in the same
          # pass — an unsigned macOS build is not a step towards a signed one.
          #
          # - label: macOS (Apple silicon)
          #   os: macos-latest
          #   rust-target: aarch64-apple-darwin
          #   args: --target aarch64-apple-darwin
          # - label: macOS (Intel)
          #   os: macos-latest
          #   rust-target: x86_64-apple-darwin
          #   args: --target x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: system webview deps
        if: matrix.os == 'ubuntu-22.04'
        # Tauri's own documented Linux prerequisites, plus what the AppImage and
        # deb bundlers shell out to. Follow the current vendor list when this
        # breaks, not this comment (AGENTS.md, "where you will be wrong").
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev \
            build-essential curl wget file libxdo-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: install frontend deps
        working-directory: client
        # tauri-action builds, it does not install. The frontend build itself is
        # tauri.conf.json's beforeBuildCommand.
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The bundler signs every updater artifact with this. tauri.conf.json
          # has createUpdaterArtifacts on, so a build with no key here fails
          # rather than quietly producing something no installed copy accepts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Linger ${{ github.ref_name }}
          releaseBody: |
            **This is the Linger app** — the thing you install on your own
            computer to join a server somebody else runs.

            **It is not the server.** If you want to *host* a Linger, nothing on
            this page is for you: the server is a container image, and the
            [host guide](https://github.com/matthewguenther/Linger/blob/main/docs/host-guide.md)
            walks through setting one up.

            ### Which file do I want?

            | Your computer | Download the file ending in |
            |---|---|
            | Windows | `-setup.exe` |
            | Debian, Ubuntu or Mint | `.deb` |
            | Fedora, RHEL or openSUSE | `.rpm` |
            | Any other Linux | `.AppImage` — make it executable and run it |
            | macOS | Not built yet — see [decisions.md](https://github.com/matthewguenther/Linger/blob/main/docs/decisions.md) |

            The `.msi` is for companies rolling it out to many machines at once.
            If you are not sure, you want the `.exe`.

            The `.sig` files and `latest.json` are how an installed copy checks
            that an update is genuine. You do not need to download them.

            **Windows will warn you.** You get *"Windows protected your PC"*, and
            *Run anyway* is behind the small *More info* link. That is Windows
            saying the installer has not been through a paid signing process. It
            has not — that is a
            [known decision](https://github.com/matthewguenther/Linger/blob/main/docs/decisions.md),
            not a broken download.

            New here? The
            [user guide](https://github.com/matthewguenther/Linger/blob/main/docs/user-guide.md)
            covers installing and using Linger in plain language.
          # Draft on purpose: publishing is what ships the update to everyone,
          # and that is a decision, not a side effect of pushing a tag.
          releaseDraft: true
          prerelease: false
          # `latest.json` — the manifest the updater reads. Every matrix job
          # merges its platform into the same file on the same release.
          includeUpdaterJson: true
