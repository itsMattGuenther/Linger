name: Windows update check

on:
  pull_request:
    paths:
      - '.github/workflows/windows-update-check.yml'
      - 'scripts/windows-update-check.ps1'
      - 'client/scripts/windows-update-check.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        installer: [nsis, msi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: client
      - name: Update published 0.3.0 through the client
        shell: pwsh
        run: scripts/windows-update-check.ps1 -Installer ${{ matrix.installer }}
