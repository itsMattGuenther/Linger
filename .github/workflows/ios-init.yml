name: ios-init

# One-off, never merged: makes the iPhone's Xcode project (gen/apple) on a Mac,
# which `tauri ios init` needs, and keeps it as an artifact to commit. No
# secrets: it signs nothing.
on:
  push:
    branches: [feat/253-iphone]
    paths: [.github/workflows/ios-init.yml]

permissions:
  contents: read

jobs:
  init:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - name: install frontend deps
        working-directory: client
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: what this Mac has
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
          command -v xcodegen || echo "no xcodegen"
          command -v pod || echo "no cocoapods"
      - name: tauri ios init
        working-directory: client
        run: pnpm tauri ios init --ci
      - name: what it made
        run: |
          git status --short
          find client/src-tauri/gen/apple -maxdepth 3 | sort
          cat client/src-tauri/gen/apple/project.yml || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gen-apple
          path: client/src-tauri/gen/apple/
          include-hidden-files: true
          retention-days: 3
