# A new server's setup link, pasted where the address went, opens the form
# that makes its host; set up, the app is in, on the list of an empty server.
# The server is reached over https (and its gateway over wss), as a real one.
appId: io.github.itsmattguenther.linger
---
- tapOn: "Server or link"
- eraseText: 80
- runFlow:
    file: subflows/type.yaml
    env:
      TEXT: ${SETUP_LINK}
- pressKey: Enter
- extendedWaitUntil:
    visible: "Nobody has set this server up yet.*"
    timeout: 45000
- takeScreenshot: 04-set-up-form
- tapOn: "Server name"
- runFlow:
    file: subflows/type.yaml
    env:
      TEXT: "Porch"
- tapOn: "Username"
- runFlow:
    file: subflows/type.yaml
    env:
      TEXT: ${HOST_USERNAME}
- tapOn: "Display name"
- runFlow:
    file: subflows/type.yaml
    env:
      TEXT: "Matt"
- tapOn: "Password"
- inputText: ${HOST_PASSWORD}
- takeScreenshot: 05-set-up-filled
- pressKey: Enter
- extendedWaitUntil:
    visible: "No rooms yet."
    timeout: 60000
# The server's name comes in its own request, after the list: the title says
# "Linger" until it does. Waited for, not looked for once. Maestro counts a
# wait's timeout from the last tap or typing, not from when the wait starts,
# so this one's is counted from the Enter, as the list's is: the list's 60 s
# and its own 30. At 30, a list that took 19 s left it 12 (#878).
- extendedWaitUntil:
    visible: "Porch"
    timeout: 90000
- takeScreenshot: 06-list-empty-server
