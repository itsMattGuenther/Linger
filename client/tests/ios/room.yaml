# A room made on the server while the app is open shows up in its list (the
# gateway, live), opens with what's been said in it, and takes a message
# typed on the phone, which the server then has.
#
# Maestro matches words whatever their case, and the whole of an element's
# words, so the room is called something nothing else on these screens is:
# a room called porch matched the server's name, Porch, in the title bar.
# Its row reads "#evenings" to VoiceOver, and so to Maestro: the # and the
# name together.
appId: io.github.itsmattguenther.linger
---
- runScript:
    file: seed.js
- extendedWaitUntil:
    visible: "#evenings"
    timeout: 30000
- takeScreenshot: 07-list-with-a-room
- tapOn: "#evenings"
- extendedWaitUntil:
    visible: "Hello from the runner."
    timeout: 30000
- takeScreenshot: 08-room
- tapOn: "Message in #evenings"
- runFlow:
    file: subflows/type.yaml
    env:
      TEXT: "Hello from the iPhone."
# No bar of iOS's own over the keyboard (Previous, Next, Done) for Send to
# sit under: Linger hides it, since the page was measured sometimes with it
# and sometimes without, and a tap on Send once landed on the bar (#881).
- assertNotVisible: "Previous"
- takeScreenshot: 09-typing-a-message
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Hello from the iPhone."
    timeout: 30000
# On screen isn't enough: the app shows a message as it sends it, and the
# words were in the box before Send. The server has to have it.
- runScript:
    file: sent.js
- assertTrue: ${output.sent}
- takeScreenshot: 10-message-sent
# The box keeps the keyboard after Send, for the next message. A finger
# dragging the conversation puts it away, with no Done to do it (#881).
# Not Maestro's hideKeyboard, which put the keyboard away without this too,
# most likely as a tap would: its drag is 26 points in 50 ms. The
# keyboard's space bar is how Maestro sees the keyboard.
- swipe:
    start: 50%, 30%
    end: 50%, 45%
    duration: 600
- assertNotVisible: "space"
- takeScreenshot: 10b-keyboard-away
