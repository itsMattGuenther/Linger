[package]
name = "linger-client"
description = "Linger desktop shell (Tauri 2)"
version = "0.3.6"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Matt Guenther"]
repository = "https://github.com/itsMattGuenther/Linger"

# Deliberately detached from the root cargo workspace: this crate links against
# system webview libraries that server/CI machines don't have. Build via
# `pnpm tauri dev` / `pnpm tauri build` inside client/.
[workspace]

[lib]
name = "linger_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
linger-core = { path = "../../crates/linger-core" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The gateway client (ARCHITECTURE §1: the WebSocket lives here, not in the
# WebView). rustls rather than native-tls so no box needs libssl headers to
# build, and the `ring` provider rather than aws-lc-rs so none needs cmake or
# nasm either. Roots come from the OS store, with the Mozilla bundle as a
# backstop — the same certificates the WebView trusts for the REST calls, which
# is what stops "HTTPS works but the gateway doesn't" from ever happening.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util"] }
tokio-tungstenite = { version = "0.29", features = [
  "connect",
  "handshake",
  "rustls-tls-native-roots",
  "rustls-tls-webpki-roots",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.9"

# Handing a link in a message to the system browser (T-304). The WebView must
# never navigate itself to a URL somebody typed into a room — that would replace
# the app with a website — and every platform opens a URL differently, with
# Windows being the one that is easy to get subtly wrong. The capability in
# `capabilities/default.json` narrows this to http and https, so it cannot be
# talked into launching a local file or a program.
tauri-plugin-opener = "2.5.4"

# A desktop notification when somebody names you (SPEC §4.2, T-305). This is
# the only push in the product — there is no badge and no unread count for one
# to hang off. Same reasoning as the opener above: every platform raises a
# notification differently and none of it is worth hand-rolling. On Linux it
# talks to the freedesktop notification service over zbus, so it adds no system
# package to anybody's build.
tauri-plugin-notification = "2"
# Window positions and sizes, remembered on this computer (T-1808), for the
# Buddy list client's windows only (`window::remembered_windows`).
tauri-plugin-window-state = "2"

# Launching Linger while it's already running (its list hidden in the tray,
# say) brings that one forward instead of starting a second copy, which would
# fight the first over the sign-ins in the keyring.
tauri-plugin-single-instance = "2"
# Already used by that plugin. Direct access requests silent desktop banners,
# so the one app sound player owns mute/quiet-hours on every desktop platform.
notify-rust = "4"

# Voice (SPEC §4.14, ARCHITECTURE §2, T-1402). Audio lives in Rust rather than
# in the WebView, and these are the whole of it: `webrtc` for the transport
# (peer connections, offer/answer, ICE, RTP), `cpal` for the microphone and
# the speakers, `opus` for the codec in between.
#
# `webrtc` needs nothing installed: it is pure Rust down to the crypto (`ring`
# via rustls). The other two are where the build box's list comes from —
# `cpal` needs ALSA's headers on Linux (`libasound2-dev` / `alsa-lib`), and
# `opus` builds the vendored libopus with `cmake`, so a shipped binary carries
# its own copy and no user's machine needs a system libopus. See the README's
# desktop-client section and `voice::device`.
webrtc = "0.14"
cpal = "0.18"
opus = "0.4"
async-trait = "0.1"
bytes = "1"
thiserror = "2"

# Signed in-app updates (T-701). `rustls-tls` for the same reason the gateway
# picked it: no box needs libssl headers to build the shell. `zip` is what
# unpacks the NSIS bundle on Windows. Both are the crate's defaults today —
# named explicitly so a future default flip to native-tls can't quietly put
# OpenSSL back into everyone's build.
tauri-plugin-updater = { version = "2.10.1", default-features = false, features = ["rustls-tls", "zip"] }

# OS keyring for the refresh token (ARCHITECTURE §7.3). Features are picked per
# platform on purpose:
#
#   Linux — `async-secret-service` + `crypto-rust` speaks the Secret Service
#   D-Bus API through zbus, in pure Rust. The alternative, `sync-secret-service`,
#   links libdbus and would add `libdbus-1-dev` to everyone's build. Note that
#   `linux-native` (kernel keyutils) is deliberately NOT enabled: it would
#   "succeed" on a headless box while losing the secret at logout, hiding the
#   no-wallet case the client is required to handle honestly.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "crypto-rust", "tokio"] }
libc = "0.2"
# Already in the tree through wry; named here so startup can ask which
# WebKitGTK it is about to run before GTK exists (#187).
webkit2gtk-sys = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
