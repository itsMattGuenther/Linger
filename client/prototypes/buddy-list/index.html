<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buddy list · Linger prototype</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- A stand-in for the desktop's own bar (Waybar, a taskbar): not part of
         Linger. The dashed group holds the prototype-only controls. -->
    <header class="topbar" aria-label="Desktop bar (stand-in)">
      <div class="tb-left" aria-hidden="true">
        <span class="tb-ws on">1</span><span class="tb-ws">2</span><span class="tb-ws">3</span><span class="tb-ws">4</span>
      </div>
      <div class="tb-right">
        <div class="proto-toggle" role="group" aria-label="Prototype only">
          <span class="pt-label">prototype</span>
          <a href="./" id="pt-one">one server</a>
          <a href="./?servers" id="pt-three">three servers</a>
          <span class="pt-sep" aria-hidden="true"></span>
          <button class="pt-btn" id="tile" aria-pressed="false" title="Tile windows side by side, the way a tiling desktop would (T)">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="4" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="7" y="2.5" width="7.5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="7" y="9" width="7.5" height="4.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
            <span>Tile</span><kbd>T</kbd>
          </button>
        </div>
        <time class="tb-clock" id="clock">Fri 10:52 PM</time>
      </div>
    </header>
    <main class="desktop" id="desktop" aria-label="Desktop"></main>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
    <script type="module" src="../shared/shots.js"></script>
  </body>
</html>
