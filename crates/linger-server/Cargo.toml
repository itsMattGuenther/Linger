[package]
name = "linger-server"
description = "The Linger server: axum REST + WS gateway, SQLite (WAL), object store adapter — one binary, one data directory"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
linger-core = { workspace = true }
linger-sfu = { workspace = true }

anyhow = { workspace = true }
argon2 = { workspace = true }
async-trait = "0.1"
axum = { workspace = true }
# Favicons are stored and served as `data:` URIs, so a link card never makes a
# request from the reader's machine (SPEC §5.6).
base64 = { workspace = true }
# Blurhash: the smear of colour shown while an image loads (PROTOCOL §6).
blurhash = "0.2"
dashmap = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
# Uploaded images are decoded and re-encoded, which is what strips EXIF and
# neutralises polyglots in one step (SPEC §4.10, ARCHITECTURE §7).
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# Magic-byte sniffing: what a file actually is, as opposed to what it claimed.
infer = "0.22"
jsonwebtoken = { workspace = true }
rand = { workspace = true }
# The S3 backend talks to the bucket over HTTP; `rusty-s3` only signs the URLs.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
ring = { workspace = true }
# S3 request signing, sans-IO: it builds and signs URLs and parses replies, and
# never touches a socket. Far less to carry than the full AWS SDK.
rusty-s3 = { version = "0.10", default-features = false, features = ["full", "rustcrypto"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
