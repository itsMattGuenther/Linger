# A Linger server in two containers: linger itself and Caddy for automatic TLS.
# Target: a non-expert friend gets this running in under 15 minutes.
#
# The quick way is setup.sh, next to this file: it asks for your domain,
# writes .env, opens the firewall and starts everything (docs/host-guide.md).
# By hand:
#
#   1. Point your domain's DNS at this machine — two records, the domain
#      itself and `cdn.` in front of it. Uploaded files are served from the
#      second one so somebody else's file is never same-origin with the app.
#   2. Copy .env.example to .env and put your domain in it. Every setting
#      lives in .env: you never edit this file or the Caddyfile, and a newer
#      copy of either can simply replace the old one.
#   3. docker compose up -d
#   4. docker compose logs linger   ← prints the one-time host-setup URL
#
# Backup = ./data/linger.db + ./data/objects/. That's the whole server. (With
# LINGER_STORAGE=s3, the bucket replaces ./data/objects/.)
#
# Updating = `./update.sh`, from deploy/ next to this file: it backs up the
# database, pulls, restarts, and says which version runs. By hand it's
# `docker compose pull && docker compose up -d`. The image below
# follows `latest`, which moves when a version is tagged; write `:0.2.0`
# instead if you would rather pick your moment. Nothing updates on its own.
# Images are published for x86-64 (Intel or AMD) only. A Raspberry Pi or an
# ARM cloud server can't run them.
#
# Voice (SPEC §4.14) goes through the linger container, on UDP 3479: open it
# in your firewall (and forward it, at home). The server sends voice through
# the address your domain points at, unless .env says otherwise. The third
# container, coturn, is a relay for people whose network blocks UDP (some
# offices, some public wifi). It is optional, and the server says so at
# startup when it's missing. .env turns it on: a secret in LINGER_TURN_SECRET
# and COMPOSE_PROFILES=voice. Open port 3478 (TCP and UDP) and UDP
# 49160–49200 for it too. It carries voice to this server's voice address and
# nowhere else (#501).

services:
  linger:
    image: ghcr.io/itsmattguenther/linger:latest
    restart: unless-stopped
    volumes:
      - ./data:/data
    # Every LINGER_* setting comes from .env: .env.example lists them, and
    # docs/host-guide.md says what each does.
    env_file: .env
    environment:
      LINGER_DATA_DIR: /data
    ports:
      # Voice forwarding's one UDP port. Nothing listens on it when
      # LINGER_VOICE_ADDRESS is off.
      - "3479:3479/udp"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The Caddyfile's two names are made from this.
      LINGER_DOMAIN: ${LINGER_DOMAIN:?Put your server's name in .env as LINGER_DOMAIN (copy .env.example to .env, or run setup.sh)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data

  # The voice relay (T-1403). Runs on the host's network directly: a relay's
  # whole job is being reachable on its real address and a range of UDP ports,
  # which Docker's own network translation would get in the way of.
  coturn:
    image: coturn/coturn:4
    restart: unless-stopped
    # Behind a profile so a plain `docker compose up -d` doesn't start it for
    # a host who never asked for a relay. COMPOSE_PROFILES=voice in .env turns
    # the profile on, so the relay starts with everything else.
    profiles: ["voice"]
    network_mode: host
    environment:
      LINGER_TURN_SECRET: ${LINGER_TURN_SECRET:-}
      LINGER_RELAY_EXTERNAL_IP: ${LINGER_RELAY_EXTERNAL_IP:-}
      # Where voice goes, read the way the server reads it, so the relay can
      # carry voice there and nowhere else (#501).
      LINGER_VOICE_ADDRESS: ${LINGER_VOICE_ADDRESS:-}
      LINGER_DOMAIN: ${LINGER_DOMAIN:-}
    # The secret is checked here, when the relay starts, and not by compose
    # when the file is read — a `${VAR:?}` in this file would refuse a plain
    # `docker compose up -d` for a host who never asked for a relay. An empty
    # secret would be an open relay, so the check is a refusal, not a default.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$LINGER_TURN_SECRET" ]; then
          echo "coturn: LINGER_TURN_SECRET is empty. Put a long random secret in .env (openssl rand -hex 32), or take COMPOSE_PROFILES=voice out of it for no relay." >&2
          exit 1
        fi

        # Where the relay may send anything (#501): this server's voice
        # address, and nowhere else. A relay that carried a member's packets
        # anywhere would reach whatever this machine can (the home network it
        # sits on, a cloud's metadata service, the internet as this machine),
        # and voice only ever needs the one address. That's
        # LINGER_VOICE_ADDRESS without its port or, with it unset, the public
        # addresses LINGER_DOMAIN points at, looked up once, now, as the
        # server does. dig asks DNS, like the server; getent, the fallback,
        # reads this machine's /etc/hosts first. Voice off, a name with no
        # public address, or no answer, and the relay carries nothing.
        address() { # an IP address, by its look
          case "$$1" in
            *:*) case "$$1" in *[!0-9a-fA-F:.]*) return 1 ;; esac ;;
            *[!0-9.]* | .* | *. | *..*) return 1 ;;
            *.*.*.*) ;;
            *) return 1 ;;
          esac
        }
        public() { # and none of the ones config.rs's is_public turns down
          address "$$1" || return 1
          case "$$1" in
            :: | ::1 | [fF][cCdD][0-9a-fA-F][0-9a-fA-F]:* | [fF][eE][89abAB][0-9a-fA-F]:* | \
            [fF][fF][0-9a-fA-F][0-9a-fA-F]:* | 0.* | 10.* | 127.* | 169.254.* | 192.168.* | \
            172.1[6-9].* | 172.2[0-9].* | 172.3[01].* | 100.6[4-9].* | 100.[7-9][0-9].* | \
            100.1[01][0-9].* | 100.12[0-7].* | 22[4-9].* | 2[3-5][0-9].*) return 1 ;;
          esac
        }
        to=""
        off=""
        allowed=""
        allow() {
          case "$$to " in *" $$1 "*) return ;; esac
          to="$$to $$1"
          allowed="$$allowed --allowed-peer-ip=$$1"
        }
        # Spaces around it count for nothing, as with the server.
        voice="$$(printf '%s' "$$LINGER_VOICE_ADDRESS" | tr -d '[:space:]')"
        case "$$voice" in
          "")
            found=""
            if [ -z "$$LINGER_DOMAIN" ]; then
              :
            elif command -v dig >/dev/null 2>&1; then
              found="$$(dig +short +time=2 +tries=2 "$$LINGER_DOMAIN" A "$$LINGER_DOMAIN" AAAA)"
            else
              found="$$(getent ahosts "$$LINGER_DOMAIN" | awk '{ print $$1 }')"
            fi
            for ip in $$found; do
              if public "$$ip"; then allow "$$ip"; fi
            done ;;
          [oO][fF][fF]) off=yes ;;
          *)
            ip="$$voice"
            case "$$ip" in
              \[*) ip="$${ip#\[}"; ip="$${ip%%\]*}" ;;
              *.*:*) ip="$${ip%:*}" ;;
            esac
            if address "$$ip"; then allow "$$ip"; fi ;;
        esac
        if [ -n "$$to" ]; then
          echo "coturn: the relay carries voice to$$to and nowhere else."
        elif [ -n "$$off" ]; then
          echo "coturn: voice is off here (LINGER_VOICE_ADDRESS is off), so the relay carries nothing."
        else
          echo "coturn: no voice address to carry voice to (LINGER_VOICE_ADDRESS is \"$$LINGER_VOICE_ADDRESS\", LINGER_DOMAIN is \"$$LINGER_DOMAIN\"), so the relay carries nothing. Set LINGER_VOICE_ADDRESS in .env to this server's public IP address, then run: docker compose up -d" >&2
        fi

        # Every peer is refused (both lines), then the voice address let
        # through: coturn checks the allowed list first. UDP only, so a
        # member can't open TCP connections through it either.
        #
        # --user-quota: relay ports one password may hold at once. The server
        # hands a member the same password all hour (turn.rs), so that's ten
        # for a person out of the 41 below: the app takes one per call, and
        # ten leaves room for a second device and for reconnects while an old
        # port waits out its ten minutes.
        #
        # --max-bps: bytes a second one relay port carries each way. The most
        # a call ever brings in is six voices (LOUDEST) at 128 kbit/s
        # (SMALL_ROOM_BITS), both in crates/linger-sfu: under 1 Mbit/s with
        # packet headers. 375000 is 3 Mbit/s, so voice never meets it.
        exec turnserver \
          --listening-port=3478 \
          --realm=${LINGER_DOMAIN} \
          --use-auth-secret \
          --static-auth-secret="$$LINGER_TURN_SECRET" \
          --min-port=49160 \
          --max-port=49200 \
          --fingerprint \
          --no-tls \
          --no-tcp-relay \
          --no-multicast-peers \
          --denied-peer-ip=0.0.0.0-255.255.255.255 \
          --denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          $$allowed \
          --user-quota=10 \
          --max-bps=375000 \
          --log-file=stdout \
          $${LINGER_RELAY_EXTERNAL_IP:+--external-ip=$$LINGER_RELAY_EXTERNAL_IP}
        # Behind a home router rather than on a machine with a public address,
        # the relay has to say where it really is: LINGER_RELAY_EXTERNAL_IP in
        # .env (setup.sh sets it when it sees a router in front).

volumes:
  caddy_data: {}
