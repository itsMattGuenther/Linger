# A Linger server in two containers: linger itself and Caddy for automatic TLS.
# Target: a non-expert friend gets this running in under 15 minutes.
#
#   1. Point your domain's DNS at this machine — two records, the domain
#      itself and `cdn.` in front of it. Uploaded files are served from the
#      second one so somebody else's file is never same-origin with the app.
#   2. Set LINGER_DOMAIN below (and both blocks of the Caddyfile) to that
#      domain.
#   3. docker compose up -d
#   4. docker compose logs linger   ← prints the one-time host-setup URL
#
# Backup = ./data/linger.db + ./data/objects/. That's the whole server. (With
# LINGER_STORAGE=s3, the bucket replaces ./data/objects/.)
#
# Updating = `docker compose pull && docker compose up -d`. The image below
# follows `latest`, which moves when a version is tagged; write `:0.2.0`
# instead if you would rather pick your moment. Nothing updates on its own.
# Images are published for x86-64 and ARM64, so a Raspberry Pi works too.
#
# Voice (SPEC §4.14): the third container, coturn, is the relay that lets two
# people on different networks hear each other. It is optional — without it
# voice works between machines on one network and the server says so at
# startup. To run it: copy `.env.example` to `.env`, put a long random secret
# in it (`openssl rand -hex 32`), set the realm to your domain below, open
# port 3478 (TCP and UDP) and UDP 49160–49200 on your firewall, and start with
# `docker compose --profile voice up -d`. The secret is read from `.env` so it
# is never in this file, which people share.

services:
  linger:
    image: ghcr.io/itsmattguenther/linger:latest
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      LINGER_DOMAIN: linger.example.com
      LINGER_DATA_DIR: /data
      LINGER_STORAGE: local
      # Files are served from cdn.<LINGER_DOMAIN> unless you say otherwise.
      # Set this only if that name is taken or you want files somewhere else;
      # it has to be a different host from LINGER_DOMAIN, and the Caddyfile
      # block has to match it.
      # LINGER_MEDIA_DOMAIN: files.linger.example.com
      # How much this server will hold in total, and how long a file stands
      # before it is swept. The defaults are 50 GB and a year; a starred file,
      # and a file on a pinned message, never expire. Sizes take a unit
      # (250GB, 500MB, 2TB) or a plain number of bytes; LINGER_FILE_EXPIRY_DAYS
      # takes a number of days, or `off` to keep everything for good.
      # LINGER_POOL_BYTES: 50GB
      # LINGER_FILE_EXPIRY_DAYS: 365
      # Files in an S3 bucket instead of ./data/objects — Cloudflare R2 is the
      # one to pick, because it charges nothing for bytes going out. Set
      # LINGER_STORAGE to s3 and fill these in; the server refuses to start if
      # any of them are missing.
      # LINGER_S3_BUCKET: linger
      # LINGER_S3_ENDPOINT: https://ACCOUNT.r2.cloudflarestorage.com
      # LINGER_S3_REGION: auto
      # LINGER_S3_ACCESS_KEY_ID: ...
      # LINGER_S3_SECRET_ACCESS_KEY: ...
      # The voice relay's shared secret, from .env (see .env.example). Set it
      # here and in coturn below, or leave it unset for no relay. If you set
      # this and want the relay somewhere other than turn:<LINGER_DOMAIN>:3478,
      # list the URIs in LINGER_TURN_URLS, separated by commas.
      LINGER_TURN_SECRET: ${LINGER_TURN_SECRET:-}
      # LINGER_TURN_URLS: turn:relay.example.com:3478?transport=udp,stun:relay.example.com:3478
      # Voice through this server (#197): everybody sends their voice once,
      # here, and the server passes it to everyone else in the room, up to 25
      # people. Set this to the machine's public IP address (not a name) and
      # open UDP 3479 on the firewall. Unset, voice stays peer to peer, up to 8.
      # The server passes voice along without keeping it; SPEC §4.14 says what
      # that means for privacy.
      # LINGER_VOICE_ADDRESS: 203.0.113.7
    ports:
      # Voice forwarding's one UDP port. Nothing listens on it unless
      # LINGER_VOICE_ADDRESS is set.
      - "3479:3479/udp"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data

  # The voice relay (T-1403). Runs on the host's network directly: a relay's
  # whole job is being reachable on its real address and a range of UDP ports,
  # which Docker's own network translation would get in the way of.
  coturn:
    image: coturn/coturn:4
    restart: unless-stopped
    # Behind a profile so a plain `docker compose up -d` still works with no
    # `.env` and no relay. Start the relay with `docker compose --profile voice
    # up -d` once the secret is in place.
    profiles: ["voice"]
    network_mode: host
    environment:
      LINGER_TURN_SECRET: ${LINGER_TURN_SECRET:-}
    # The secret is checked here, when the relay starts, and not by compose
    # when the file is read — a `${VAR:?}` in this file would refuse a plain
    # `docker compose up -d` for a host who never asked for a relay. An empty
    # secret would be an open relay, so the check is a refusal, not a default.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$LINGER_TURN_SECRET" ]; then
          echo "coturn: LINGER_TURN_SECRET is empty. Copy .env.example to .env and put a long random secret in it." >&2
          exit 1
        fi
        exec turnserver \
          --listening-port=3478 \
          --realm=linger.example.com \
          --use-auth-secret \
          --static-auth-secret="$$LINGER_TURN_SECRET" \
          --min-port=49160 \
          --max-port=49200 \
          --fingerprint \
          --no-cli \
          --no-tls \
          --no-multicast-peers \
          --log-file=stdout
        # Behind a home router rather than on a machine with a public address?
        # Add your public IP to the list above so the relay tells clients where
        # it really is:   --external-ip=203.0.113.7 \

volumes:
  caddy_data: {}
