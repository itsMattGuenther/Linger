[workspace]
resolver = "2"
members = [
    "crates/linger-core",
    "crates/linger-server",
]
# client/src-tauri is deliberately its own workspace: it links against system
# webview libraries (WebKitGTK etc.) that server/CI machines don't have.
# Build it through `pnpm tauri` inside client/.

[workspace.package]
version = "0.3.5"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Matt Guenther"]
repository = "https://github.com/itsMattGuenther/Linger"

[workspace.dependencies]
linger-core = { path = "crates/linger-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
ts-rs = { version = "10", features = ["serde-compat"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
jsonwebtoken = "9"
ring = "0.17"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
dashmap = "6"
futures-util = "0.3"

[profile.release]
lto = "thin"
strip = true
